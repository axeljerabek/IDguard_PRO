<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="proGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <style>
      .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 36px; fill: #f8fafc; }
      .text-pro { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 36px; fill: url(#proGradient); }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #94a3b8; letter-spacing: 3.5px; }
    </style>
  </defs>

  <!-- Hintergrund (Optional, für Dark Mode optimiert) -->
  <rect width="400" height="120" rx="12" fill="#0f172a" />

  <!-- Logo Icon (Links) -->
  <g transform="translate(20, 20)">
    <!-- Äußeres Hexagon / Schild -->
    <path d="M40 5 L70 20 L70 55 L40 75 L10 55 L10 20 Z" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" />
    
    <!-- KI Bounding Box Ecken -->
    <path d="M 5 15 L 5 8 L 15 8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 75 15 L 75 8 L 65 8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 5 65 L 5 72 L 15 72" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 75 65 L 75 72 L 65 72" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Kameralinse / Auge im Zentrum -->
    <circle cx="40" cy="40" r="16" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="40" cy="40" r="6" fill="url(#proGradient)" />
    
    <!-- Scan-Punkt / Glanz -->
    <circle cx="44" cy="36" r="2" fill="#ffffff" />
  </g>

  <!-- Typografie (Rechts) -->
  <g transform="translate(115, 68)">
    <text x="0" y="0">
      <tspan class="text-main">IDguard</tspan>
      <tspan class="text-pro" dx="8">PRO</tspan>
    </text>
    <text x="2" y="20" class="text-sub">AI SURVEILLANCE SENTINEL</text>
  </g>
</svg>
